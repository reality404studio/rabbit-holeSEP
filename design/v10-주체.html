<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>THE RABBIT HOLE — v10 주체</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   v10 — 베이스라인 차분 3지점

   베이스라인: v9 (빈티지 신문). 사용자 태깅 "너무 장식적".
   벡터: Martens / Werkplaats 축 (유연한 격자, 공정이 보이는 제작)
   활자는 깨지 않는다 — 명조+OSTT 유지. 남은 매끄러움이 균열의 액자다.

   균열 1 · 물성 → 공간축 「오차가 보이는 예약」
     망점·종이그림자·인쇄대·롤러·적색 오등록 전부 삭제.
     대신 블록마다 예약 높이를 잡고, 조판 후 실제 높이와의 차이를 남긴다.
     숫자는 하드코딩이 아니라 getBoundingClientRect() 실측이다.

   균열 2 · 색 → 주체축 「색 = 발화 주체」
     크림+적색 폐기. 세 주체가 세 잉크를 쓴다.
       SEP 원문  = 순흑     남의 글. 가장 권위. 가장 진한 잉크.
       편집자    = 중간회색 기계의 말. 잉크가 덜 실린다.
       사용자    = #0033ff  RGB 원색 파랑 — 4색 인쇄로 낼 수 없는 색이다.
                            종이 흉내의 정확한 반대. 화면에서만 존재한다.

   균열 3 · 기하 → 자유축 「섹션마다 시작 칸이 다름」
     중앙 1080 대칭 박스 폐기. 12칸은 유지하되 섹션마다 다른 칸에서
     시작하고 다른 폭을 먹는다. 좌·우 가장자리가 둘 다 들쭉날쭉해진다.
     읽는 순서 기능은 격자 좌표 표기(모노)로 보존한다.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* ─ 잉크 = 발화 주체 ─ 균열 2 ─ */
  --sep:#000;          /* SEP 원문 — 21:1 */
  --ed:#5c5c5c;        /* 편집자 — 6.9:1, AA 통과 */
  --ed-2:#8a8a8a;      /* 편집자 보조 — 3.5:1, 대형/비본문 전용 */
  --user:#0033ff;      /* 사용자 — 7.2:1 on white, AA 통과 */
  --paper:#fff;        /* 종이인 척하지 않는다. 순백 = 화면의 기본값 */
  --hair:rgba(0,0,0,.16);
  --hair-2:rgba(0,0,0,.07);
  --rsv:rgba(92,92,92,.45);   /* 예약선 — 기계의 예측이므로 편집자 색 */

  /* ─ 활자 ─ v9에서 그대로. 순서를 바꾸지 말 것 ─ */
  --ko:"Nanum Myeongjo",serif;
  --la:"Old Standard TT",Georgia,serif;
  --prose:"Old Standard TT","Nanum Myeongjo",serif;
  --mo:"JetBrains Mono",ui-monospace,monospace;

  /* ─ 역할 스케일 ─ v9에서 그대로 ─ */
  --t-r1:56px; --t-r2:40px; --t-r3:26px; --t-r4:20px;
  --t-body:16px; --t-meta:12px;
  --lh-display:1.2; --lh-r1:1.35; --lh-r3:1.45; --lh-r4:1.55;
  --lh-body:1.75; --lh-meta:1.6;
  --tr-display:-.035em; --tr-title:-.025em; --tr-body:-.015em;
  --tr-la:.13em; --tr-la-sm:.17em; --tr-la-xs:.04em; --tr-mo:.06em;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
  --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --gap-section:56px; --gap-rule-head:12px; --gap-head-body:24px;

  /* ─ 예약 높이 ─ 28px 본문 행상자의 배수. 균열 1의 기준값 ─ */
  --rsv-lead:168px;    /* 6행 */
  --rsv-pair:140px;    /* 5행 */
  --rsv-facing:112px;  /* 4행 */
  --rsv-row:56px;      /* 2행 × 항목수 */

  /* ─ 지면 기하 ─ 균열 3. sheet-max 1080 은 여기서 폐기됐다 ─ */
  --cols:12; --gut:24px; --pad:56px; --sheet-max:1440px;

  --hs:42;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  font-family:var(--prose); font-weight:400;
  font-size:var(--t-body); line-height:var(--lh-body);
  letter-spacing:var(--tr-body); color:var(--sep);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  word-break:keep-all; line-break:strict; overflow-wrap:normal;
  font-variant-numeric:tabular-nums;
}
a{color:inherit;text-decoration:none}


/* ═══ 격자 ═══ 균열 3 ══════════════════════════════════════════════════ */

.sheet{
  max-width:var(--sheet-max); margin:0 auto;
  padding:var(--s8) var(--pad) 120px;
  display:grid; grid-template-columns:repeat(var(--cols),1fr);
  column-gap:var(--gut); row-gap:0;
}
/* 모든 블록은 자기 시작 칸을 직접 선언한다. 기본값이 없다 —
   기본값을 두면 안 정한 블록이 전부 같은 칸으로 몰려 대칭이 되살아난다 */
.band{grid-column:var(--c1)/var(--c2)}

/* 격자 좌표 — 읽는 순서 기능의 보존 장치. 장식이 아니라 주소다 */
.coord{
  font-family:var(--mo); font-size:10px; letter-spacing:var(--tr-mo);
  color:var(--ed-2); display:block; margin-bottom:var(--s2);
}


/* ═══ 제호 ═══════════════════════════════════════════════════════════ */

.mh{--c1:1;--c2:8; margin-bottom:var(--s7)}
.mh h1{
  font-family:var(--la); font-weight:400;
  font-size:clamp(30px,5vw,56px); line-height:var(--lh-display);
  letter-spacing:.02em; margin:0; color:var(--sep);
}
.mh .sub{
  display:block; font-family:var(--ko); font-size:var(--t-meta);
  line-height:var(--lh-meta); color:var(--ed);
  margin-top:var(--s3); letter-spacing:0;
}


/* ═══ 사용자 구역 ═══ 균열 2 — 여기 잉크는 전부 --user ══════════════ */

.slot{--c1:1;--c2:11; padding-bottom:var(--s7); border-bottom:1px solid var(--hair)}
.slot .kick{
  font-family:var(--la); font-size:var(--t-meta); text-transform:uppercase;
  letter-spacing:var(--tr-la-sm); color:var(--user); display:block;
  margin-bottom:var(--s4);
}
.q{
  width:100%; display:block; border:0; padding:0; margin:0; resize:none;
  background:transparent; font-family:var(--prose);
  font-size:calc(var(--hs)*1px); line-height:var(--lh-display);
  letter-spacing:var(--tr-display); color:var(--user);
  overflow:hidden; outline:none;
}
.q::placeholder{color:rgba(0,51,255,.34)}
.deck{
  font-family:var(--ko); font-size:var(--t-body); line-height:var(--lh-body);
  color:var(--ed); max-width:46ch; margin:var(--s6) 0 0;
}
.deck .lat{font-family:var(--la); font-size:1.05em; letter-spacing:var(--tr-la-xs)}
.ctl{display:flex; align-items:baseline; gap:var(--s5); margin-top:var(--s6)}
.go{
  font-family:var(--la); font-size:var(--t-meta); text-transform:uppercase;
  letter-spacing:var(--tr-la-sm); background:transparent; cursor:pointer;
  border:1px solid var(--user); color:var(--user);
  padding:var(--s3) var(--s5);
}
.go:disabled{border-color:var(--hair); color:var(--ed-2); cursor:default}
.count{font-family:var(--mo); font-size:var(--t-meta); color:var(--ed-2); letter-spacing:var(--tr-mo)}
.count .num{color:var(--user)}


/* ═══ 상태 ═══ 균열 1 — 은폐하지 않는다. 진행을 숫자로 말한다 ═══════ */

.status{
  --c1:1;--c2:13; margin-top:var(--s5);
  font-family:var(--mo); font-size:var(--t-meta); letter-spacing:var(--tr-mo);
  color:var(--ed); opacity:0; transition:opacity .2s;
}
.status.show{opacity:1}


/* ═══ 섹션 ═══ 균열 3 — 칸이 섹션마다 다르다 ═══════════════════════ */

.sec{margin-top:var(--gap-section); position:relative}
.sec::before{
  content:""; position:absolute; left:0; right:0; top:calc(var(--gap-section)*-.5);
  border-top:1px solid var(--hair);
}
.sechd{
  display:flex; align-items:baseline; gap:var(--s4);
  padding-top:var(--gap-rule-head); margin-bottom:var(--gap-head-body);
}
.sechd .en{
  font-family:var(--la); font-size:var(--t-meta); text-transform:uppercase;
  letter-spacing:var(--tr-la-sm); color:var(--ed);
}
.sechd .ko{font-family:var(--ko); font-size:var(--t-meta); color:var(--ed-2)}


/* ═══ 예약과 실제 ═══ 균열 1 ═══════════════════════════════════════ */

/* 예약 칸 — 조판 전. 카드가 아니라 아직 인쇄되지 않은 자리다 */
.body{position:relative; min-height:var(--rsv-h)}

/* 예약선 — 조판 후에도 남는다. 기계가 예상했던 높이의 흔적 */
.body::after{
  content:""; position:absolute; left:0; right:0; top:var(--rsv-h);
  border-top:1px dashed var(--rsv); opacity:0; transition:opacity .3s;
  pointer-events:none;
}
.set .body::after{opacity:1}

.blank .body{border-top:1px solid var(--hair-2); border-bottom:1px solid var(--hair-2)}
/* 예약 = 자리는 잡혔고 잉크는 아직이다. display:none 이 아니라
   visibility:hidden — 레이아웃을 유지해야 오차를 잴 수 있다 */
.blank .blk{visibility:hidden}

/* 차분 캡션 — 하드코딩 금지. JS 실측값이 들어온다 */
.delta{
  font-family:var(--mo); font-size:10px; letter-spacing:var(--tr-mo);
  color:var(--ed-2); margin-top:var(--s4); display:none;
}
.set .delta{display:block}
.delta b{font-weight:500; color:var(--ed)}


/* ═══ 항목 ═══ 균열 2 — 제목·URL 은 SEP 것이므로 순흑 ═════════════ */

.item{margin-bottom:var(--s6)}
.item:last-child{margin-bottom:0}
.kk{
  font-family:var(--ko); font-size:var(--t-meta); color:var(--ed);
  display:block; margin-bottom:var(--s2);
}
.t{
  display:block; font-family:var(--prose); color:var(--sep);
  font-size:var(--t-r3); line-height:var(--lh-r3); letter-spacing:var(--tr-title);
}
.lead .t{font-size:var(--t-r1); line-height:var(--lh-r1)}
.t:hover{text-decoration:underline; text-underline-offset:4px}
.u{
  display:block; font-family:var(--la); font-size:var(--t-meta);
  letter-spacing:var(--tr-la-xs); color:var(--ed-2);
  margin-top:var(--s2);
}
/* 해설은 편집자가 쓴 것이다 — 회색 */
.item .n{
  font-family:var(--ko); font-size:var(--t-body); line-height:var(--lh-body);
  color:var(--ed); margin:var(--s4) 0 0; max-width:44ch;
}
.lead .n{font-size:var(--t-r4); line-height:var(--lh-r4); max-width:40ch}

.pair,.facing{display:grid; grid-template-columns:1fr 1fr; gap:var(--s5) var(--gut)}
.ladder .row{
  display:grid; grid-template-columns:auto 1fr; gap:var(--s4);
  padding:var(--s4) 0; border-top:1px solid var(--hair-2);
}
.ladder .row:first-child{border-top:0}
.ladder .no{font-family:var(--mo); font-size:var(--t-meta); color:var(--ed-2)}
.ladder .t{font-size:var(--t-r4); line-height:var(--lh-r4)}
.ladder .n{font-size:var(--t-meta); line-height:var(--lh-meta); margin-top:var(--s1)}


/* ═══ 판권 ═══════════════════════════════════════════════════════════ */

.foot{
  --c1:4;--c2:13; margin-top:120px; padding-top:var(--s5);
  border-top:1px solid var(--hair);
}
.foot p{
  font-family:var(--ko); font-size:var(--t-meta); line-height:var(--lh-meta);
  color:var(--ed); max-width:52ch; margin:0;
}
.foot .r{
  display:block; font-family:var(--la); font-size:var(--t-meta);
  letter-spacing:var(--tr-la-xs); color:var(--ed-2); margin-top:var(--s3);
}
.legend{
  --c1:1;--c2:4; margin-top:120px; padding-top:var(--s5);
  border-top:1px solid var(--hair);
  font-family:var(--mo); font-size:10px; letter-spacing:var(--tr-mo);
  line-height:2; color:var(--ed-2);
}
.legend i{font-style:normal; display:inline-block; width:8px; height:8px; margin-right:6px}


/* ═══ 좁은 화면 ═══ 12칸 → 6칸. 오프셋은 절반으로 접는다 ═══════════ */

@media (max-width:900px){
  :root{--cols:6; --pad:24px}
  .sheet{padding-top:var(--s6)}
  .mh{--c1:1;--c2:7}
  .slot{--c1:1;--c2:7}
  .foot{--c1:2;--c2:7}
  .legend{--c1:1;--c2:7}
  .pair,.facing{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="sheet" id="sheet">

  <header class="band mh" style="--c1:1;--c2:8">
    <span class="coord">col 01–07</span>
    <h1>The Rabbit Hole</h1>
    <span class="sub">질문에서 시작하는 스탠퍼드 철학백과사전</span>
  </header>

  <form class="band slot" id="form" style="--c1:1;--c2:11">
    <span class="coord">col 01–10 · 사용자</span>
    <span class="kick">Start here</span>
    <textarea class="q" id="q" rows="1" maxlength="60"
      placeholder="궁금한 것을 한 줄의 헤드라인으로 써보세요."></textarea>
    <p class="deck" id="deck">편집자는 답을 대신 쓰지 않습니다. <span class="lat">SEP</span>&nbsp;원문으로 들어갈 읽기 순서를 소개합니다.</p>
    <div class="ctl">
      <button class="go" id="go" type="submit" disabled>조판</button>
      <span class="count"><span class="num" id="cnt">0</span> / 60</span>
    </div>
  </form>

  <div class="band status" id="status" style="--c1:1;--c2:13"></div>

  <div id="board" style="display:contents"></div>

  <section class="band legend" style="--c1:1;--c2:4">
    <span class="coord">col 01–03</span>
    <i style="background:#000"></i>SEP 원문<br>
    <i style="background:#5c5c5c"></i>편집자<br>
    <i style="background:#0033ff"></i>사용자<br>
    <span style="opacity:.7">- - -  예약 높이</span>
  </section>

  <footer class="band foot" style="--c1:4;--c2:13">
    <span class="coord">col 04–12</span>
    <p>이 지면이 손실시키는 것 — 본문 그 자체, 항목 사이의 상호 참조, 각 항목의 역사적 맥락. 모두 <span class="lat">SEP</span> 안에 있습니다.</p>
    <span class="r">Stanford Encyclopedia of Philosophy</span>
  </footer>

</div>

<script>
/* 데이터는 v9 컴프와 동일하다. 비교 대상이 바뀌면 차분이 안 나온다 */
const ROUTE=[
  {en:"Lead story",ko:"먼저 읽을 것",kind:"lead",c1:3,c2:13,rsv:"var(--rsv-lead)",items:[
    {t:"기능주의",u:"functionalism",n:"마음을 무엇으로 만들어졌는지가 아니라 무엇을 하는지로 정의하는 입장. ‘기계가 마음을 가질 수 있는가’라는 질문이 여기서 처음 논리적인 형태를 얻는다. 이 항목을 먼저 읽으면 나머지 논쟁의 좌표가 보인다."}
  ]},
  {en:"Background",ko:"먼저 깔아 둘 것",kind:"pair",c1:1,c2:9,rsv:"var(--rsv-pair)",items:[
    {t:"심신 이원론",u:"dualism",n:"마음과 물질을 둘로 나누는 오래된 구분. 기능주의가 무엇에 반대해 등장했는지를 먼저 확인한다."},
    {t:"계산주의적 마음 이론",u:"computational-mind",n:"사고를 기호 연산으로 보는 관점. 오늘의 인공지능 논의가 서 있는 전제다."}
  ]},
  {en:"The dispute",ko:"여기서부터 갈라진다",kind:"facing",c1:5,c2:13,rsv:"var(--rsv-facing)",items:[
    {kk:"이해는 없다",t:"중국어 방 논변",u:"chinese-room",n:"규칙에 따라 기호를 옮기는 것만으로는 의미를 이해한 것이 아니라는 반론."},
    {kk:"행동이 전부다",t:"튜링 테스트",u:"turing-test",n:"구별할 수 없다면 구별할 근거도 없다는 반대편의 주장."}
  ]},
  {en:"Deeper down the hole",ko:"더 내려가고 싶다면",kind:"ladder",c1:7,c2:13,rsv:"calc(var(--rsv-row)*4)",items:[
    {t:"의식",u:"consciousness",n:"경험이 있다는 것 자체가 왜 문제인가."},
    {t:"철학적 좀비",u:"zombies",n:"기능이 같아도 경험은 빠질 수 있는가."},
    {t:"타인의 마음",u:"other-minds",n:"타인에게 마음이 있다고 믿는 근거."},
    {t:"지향성",u:"intentionality",n:"생각이 무언가에 ‘대한’ 것이 되는 방식."}
  ]}
];
const $=id=>document.getElementById(id);
const q=$("q"),go=$("go"),cnt=$("cnt"),board=$("board"),status=$("status");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const url=s=>"https://plato.stanford.edu/entries/"+s+"/";
let busy=false;

function pad(n){return String(n).padStart(2,"0")}

function itemHTML(kind,it,i){
  const link=`<a class="t" href="${url(it.u)}" target="_blank" rel="noopener noreferrer">${it.t}</a>`;
  const u=`<a class="u" href="${url(it.u)}" target="_blank" rel="noopener noreferrer">plato.stanford.edu/${it.u}</a>`;
  if(kind==="ladder")
    return `<div class="row"><span class="no">${pad(i+1)}</span><div>${link}<p class="n">${it.n}</p></div></div>`;
  const kk=it.kk?`<span class="kk">${it.kk}</span>`:"";
  return `<div class="item${kind==="lead"?" lead":""}">${kk}${link}${u}<p class="n">${it.n}</p></div>`;
}

/* 골조 — 예약 상태. 각 섹션이 자기 칸과 예약 높이를 선언한다 */
function frame(){
  board.innerHTML=ROUTE.map((s,si)=>{
    const inner=s.items.map((it,i)=>itemHTML(s.kind,it,i)).join("");
    const wrap=(s.kind==="lead")?inner:`<div class="${s.kind}">${inner}</div>`;
    return `<section class="band sec blank" data-i="${si}"
              style="--c1:${s.c1};--c2:${s.c2};--rsv-h:${s.rsv}">
      <span class="coord">col ${pad(s.c1)}–${pad(s.c2-1)}</span>
      <div class="sechd"><span class="en">${s.en}</span><span class="ko">${s.ko}</span></div>
      <div class="body"><div class="blk">${wrap}</div></div>
      <p class="delta"></p>
    </section>`;
  }).join("");
}

/* 균열 1 의 핵심 — 예약과 실제의 차이를 실측해서 지면에 남긴다.
   이 숫자를 상수로 적는 순간 이 디자인은 다시 장식이 된다 */
function measure(sec){
  const body=sec.querySelector(".body");
  const delta=sec.querySelector(".delta");
  /* 예약은 .body 의 min-height, 실제는 .blk 의 실측 높이다.
     .body 를 재면 min-height 가 하한이 되어 음수 오차가 사라진다 */
  const rsv=parseFloat(getComputedStyle(body).getPropertyValue("min-height"));
  const act=Math.round(sec.querySelector(".blk").getBoundingClientRect().height);
  const d=act-Math.round(rsv);
  const sign=d>0?"+":d<0?"−":"±";
  delta.innerHTML=`RESERVED ${Math.round(rsv)}  SET ${act}  Δ <b>${sign}${Math.abs(d)}</b>`;
}

const HS=[72,60,50,42,36,30];
function fit(){
  const n=(q.value||q.placeholder).length;
  q.style.setProperty("--hs", n<=9?HS[0]:n<=15?HS[1]:n<=22?HS[2]:n<=32?HS[3]:n<=44?HS[4]:HS[5]);
  q.style.height="auto"; q.style.height=q.scrollHeight+"px";
}
function tick(){
  cnt.textContent=q.value.length;
  go.disabled=busy||!q.value.trim();
  fit();
}
q.addEventListener("input",tick);
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
window.addEventListener("resize",()=>{fit();document.querySelectorAll(".sec.set").forEach(measure)});

function say(t){status.textContent=t; status.classList.add("show")}

async function compose(){
  if(busy||!q.value.trim())return;
  busy=true; go.disabled=true; go.textContent="조판 중";
  q.blur(); frame();

  const secs=[...board.querySelectorAll(".sec")];
  say(`RESERVING  ${secs.length} blocks`);
  await wait(500);

  /* 한 블록씩 앉힌다. 앉을 때마다 오차가 확정되고 아래가 밀린다 */
  for(let i=0;i<secs.length;i++){
    say(`SETTING  ${pad(i+1)} / ${pad(secs.length)}  ${ROUTE[i].en}`);
    secs[i].classList.remove("blank");
    secs[i].classList.add("set");
    measure(secs[i]);
    await wait(420);
  }

  const total=secs.reduce((a,s)=>{
    const b=s.querySelector(".body");
    return a+(Math.round(s.querySelector(".blk").getBoundingClientRect().height)
              -Math.round(parseFloat(getComputedStyle(b).getPropertyValue("min-height"))));
  },0);
  say(`SET  ${secs.length} blocks  ·  총 오차 ${total>=0?"+":"−"}${Math.abs(total)}px`);
  go.textContent="다시"; busy=false; go.disabled=false;
}
$("form").addEventListener("submit",e=>{e.preventDefault();compose()});

frame(); tick();
</script>
</body>
</html>
